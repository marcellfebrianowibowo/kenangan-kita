<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You and Me ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0b070c;
            color: #f3f4f6;
        }
        .romantic-font {
            font-family: 'Dancing Script', cursive;
        }
        /* Efek Hati Bertebaran */
        .heart {
            position: absolute;
            background: #ff2a75;
            transform: rotate(-45deg);
            animation: fall linear infinite;
            z-index: 10;
        }
        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: #ff2a75;
            border-radius: 50%;
        }
        .heart::before { top: -50%; left: 0; }
        .heart::after { top: 0; left: 50%; }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(-45deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(-45deg); opacity: 0; }
        }
        .neon-glow {
            text-shadow: 0 0 15px rgba(255, 42, 117, 0.7), 0 0 30px rgba(255, 42, 117, 0.4);
        }
        .neon-box {
            box-shadow: 0 0 25px rgba(255, 42, 117, 0.25);
        }
        .glass-card {
            background: rgba(20, 12, 20, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 42, 117, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center overflow-x-hidden relative p-4">

    <!-- AUDIO LATAR BELAKANG -->
    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
    </audio>

    <!-- TOMBOL KONTROL MUSIK -->
    <div id="musicControl" class="fixed top-4 right-4 z-50 hidden">
        <button onclick="toggleMusic()" class="glass-card px-4 py-2 rounded-full text-pink-400 text-xs font-semibold flex items-center gap-2 shadow-lg hover:bg-pink-950/50 transition cursor-pointer">
            <span id="musicIcon">🎵</span> <span id="musicText">Pause Music</span>
        </button>
    </div>

    <div class="w-full max-w-md mx-auto relative z-20">

        <!-- TAHAP 1: LOGIN KODE RAHASIA -->
        <div id="loginSection" class="glass-card p-8 rounded-3xl neon-box text-center transition-all duration-700">
            <div class="text-4xl mb-3 animate-bounce">🔐</div>
            <h2 class="text-2xl font-bold text-pink-400 mb-1">Access Our World</h2>
            <p class="text-xs text-gray-400 mb-6">A special place, just for you & me ❤️</p>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="text-xs text-pink-300 block mb-1">Nama Panggilan Kamu</label>
                    <input type="text" id="nameInput" placeholder="Masukkan nama..." class="w-full bg-[#1f1220] border border-pink-500/30 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-pink-500">
                </div>
                <div>
                    <label class="text-xs text-pink-300 block mb-1">Kata Sandi / Tanggal Spesial (Cth: 1204)</label>
                    <input type="password" id="passInput" placeholder="••••" class="w-full bg-[#1f1220] border border-pink-500/30 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-pink-500">
                </div>
                <button onclick="unlockSurprise()" class="w-full bg-gradient-to-r from-pink-600 to-rose-500 text-white font-semibold py-3 rounded-xl shadow-lg hover:opacity-90 transition-all cursor-pointer mt-2">
                    Unlock Surprise 💖
                </button>
            </div>
            <p id="errorMsg" class="text-xs text-red-400 mt-3 hidden">Ups, nama atau sandinya kurang tepat! Coba lagi ya.</p>
        </div>

        <!-- TAHAP 2: KONTEN SLIDE / PRESENTASI (AWALNYA HIDDEN) -->
        <div id="slideContainer" class="hidden opacity-0 transition-opacity duration-700">
            
            <!-- Indikator Slide (Contoh: Slide 1 dari 4) -->
            <div class="flex justify-between items-center mb-3 px-2">
                <span class="text-xs text-pink-400 font-semibold tracking-wider uppercase">✨ Our Journey</span>
                <span id="slideIndicator" class="text-xs text-gray-400 bg-pink-950/40 px-3 py-1 rounded-full border border-pink-500/20">Slide 1 / 4</span>
            </div>

            <!-- KOTAK SLIDE UTAMA -->
            <div class="glass-card p-6 rounded-3xl neon-box min-h-[400px] flex flex-col justify-between relative overflow-hidden">
                
                <!-- ISI MASING-MASING SLIDE -->
                <div id="slideContent" class="flex flex-col items-center text-center my-auto transition-all duration-500">
                    <!-- Konten akan diisi oleh JavaScript di bawah -->
                </div>

                <!-- TOMBOL NAVIGASI (BACK & NEXT) -->
                <div class="flex justify-between items-center mt-6 pt-4 border-t border-pink-500/20">
                    <button id="prevBtn" onclick="changeSlide(-1)" class="px-4 py-2 rounded-xl bg-pink-950/40 text-pink-300 text-xs font-semibold border border-pink-500/30 hover:bg-pink-900/50 transition cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed">
                        ❮ Sebelumnya
                    </button>
                    
                    <button id="nextBtn" onclick="changeSlide(1)" class="px-5 py-2 rounded-xl bg-gradient-to-r from-pink-600 to-rose-500 text-white text-xs font-semibold shadow-lg hover:opacity-90 transition cursor-pointer">
                        Selanjutnya ❯
                    </button>
                </div>

            </div>
        </div>

    </div>

    <!-- SCRIPT PRESENTASI SLIDE -->
    <script>
        // DATA UNTUK TIAP SLIDE (Foto & Kata-kata bisa kamu ganti bebas di sini!)
        const slides = [
            {
                title: "You and Me",
                subtitle: "Our Special Story",
                image: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=500&q=80",
                text: "Setiap detik bersamamu adalah kebahagiaan paling nyata yang pernah aku miliki di dunia ini. Terima kasih sudah hadir. 💖",
                tag: "Awal Cerita Kita"
            },
            {
                title: "Our Sweet Smile",
                subtitle: "Memori Indah",
                image: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=500&q=80",
                text: "Banyak hal seru dan tawa yang kita lewatin bareng. Senyum kamu selalu jadi alasan buat aku semangat tiap hari. 😊",
                tag: "Momen Seru"
            },
            {
                title: "Together Forever",
                subtitle: "Saling Menguatkan",
                image: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=500&q=80",
                text: "Susah senang kita hadapin sama-sama. Aku bersyukur banget punya partner sehebat dan sepeduli kamu. ♾️",
                tag: "Genggam Tanganku"
            },
            {
                title: "My Happy Place",
                subtitle: "Surat Cinta Untukmu",
                image: "https://images.unsplash.com/photo-1494774157365-9e04c6720e47?auto=format&fit=crop&w=500&q=80",
                text: "\"Terima kasih sudah mau berjuang dan bertahan sejauh ini. Semoga ke depannya, cerita ini bakal terus ada... kamu dan aku, selamanya.\"\n\n— Forever Yours ❤️",
                tag: "Pesan Terakhir"
            }
        ];

        let currentSlide = 0;

        function unlockSurprise() {
            const name = document.getElementById('nameInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if(name !== "" && pass !== "") {
                // Putar Musik
                const music = document.getElementById('bgMusic');
                music.play().then(() => {
                    document.getElementById('musicControl').classList.remove('hidden');
                }).catch(err => console.log("Audio play error:", err));

                // Transisi dari Login ke Slide
                const loginSection = document.getElementById('loginSection');
                loginSection.style.transform = 'scale(0.9)';
                loginSection.style.opacity = '0';

                setTimeout(() => {
                    loginSection.style.display = 'none';
                    const slideContainer = document.getElementById('slideContainer');
                    slideContainer.classList.remove('hidden');
                    setTimeout(() => {
                        slideContainer.classList.add('opacity-100');
                        renderSlide(); // Tampilkan slide pertama
                    }, 50);

                    startHearts(); // Efek hati jatuh
                }, 500);
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        // Fungsi Render Tampilan Slide
        function renderSlide() {
            const slide = slides[currentSlide];
            const container = document.getElementById('slideContent');
            
            // Animasi kecil saat pindah slide
            container.style.opacity = '0';
            container.style.transform = 'translateY(10px)';

            setTimeout(() => {
                container.innerHTML = `
                    <span class="text-[10px] text-pink-400 bg-pink-950/60 px-3 py-1 rounded-full mb-3 border border-pink-500/30 uppercase tracking-widest">${slide.tag}</span>
                    
                    ${currentSlide === 0 ? 
                        `<h1 class="romantic-font text-5xl text-pink-500 my-1 neon-glow">${slide.title}</h1>` : 
                        `<h2 class="font-bold text-xl text-pink-300 mb-3">${slide.title}</h2>`
                    }

                    <!-- Bingkai Foto Per Slide -->
                    <div class="w-40 h-40 bg-white p-2 rounded-2xl shadow-xl my-3 transform rotate-1 hover:rotate-0 transition-transform">
                        <img src="${slide.image}" alt="Foto Kenangan" class="w-full h-full object-cover rounded-xl">
                    </div>

                    <!-- Teks / Kata-kata -->
                    <p class="text-xs text-gray-300 leading-relaxed mt-2 px-2 italic">
                        ${slide.text}
                    </p>
                `;

                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 200);

            // Update Teks Indikator Slide & Tombol
            document.getElementById('slideIndicator').innerText = `Slide ${currentSlide + 1} / ${slides.length}`;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            
            const nextBtn = document.getElementById('nextBtn');
            if (currentSlide === slides.length - 1) {
                nextBtn.innerText = "Selesai ❤️";
            } else {
                nextBtn.innerText = "Selanjutnya ❯";
            }
        }

        // Fungsi Tombol Next & Previous Slide
        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide < 0) {
                currentSlide = 0;
            } else if (currentSlide >= slides.length) {
                currentSlide = 0; // Kalau sudah di slide terakhir, balik lagi ke awal (atau bisa diatur diam di tempat)
            }
            renderSlide();
        }

        // Kontrol Musik
        let isPlaying = true;
        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const musicText = document.getElementById('musicText');
            const musicIcon = document.getElementById('musicIcon');

            if (isPlaying) {
                music.pause();
                musicText.innerText = "Play Music";
                musicIcon.innerText = "🔇";
            } else {
                music.play();
                musicText.innerText = "Pause Music";
                musicIcon.innerText = "🎵";
            }
            isPlaying = !isPlaying;
        }

        // Animasi Hati Jatuh
        function startHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.style.left = Math.random() * 100 + 'vw';
                const size = Math.random() * 8 + 8;
                heart.style.width = size + 'px';
                heart.style.height = size + 'px';
                const duration = Math.random() * 3 + 3;
                heart.style.animationDuration = duration + 's';
                document.body.appendChild(heart);
                setTimeout(() => { heart.remove(); }, duration * 1000);
            }, 250);
        }
    </script>
</body>
</html>
